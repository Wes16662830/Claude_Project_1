name: Deploy Hyrox to GitHub Pages

# Deploys ONLY the Hyrox app, from its own branch, into its own subfolder
# (/hyrox/) of the gh-pages branch. Using keep_files means it never deletes
# other apps' folders — so projects sharing this repo stop clobbering each
# other. Each app should use the same pattern with its own branch + dir.

on:
  push:
    branches: [claude/hyrox-doubles-trainer-3a1e2b]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-hyrox
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: hyrox
          keep_files: true
