<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="refresh" content="0; url=../leads/" />
<title>Leads &amp; Contacts</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #FAF7F0; color: #23291F; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; text-align: center; }
  a { color: #0F4C3A; font-weight: 600; }
</style>
</head>
<body>
<p>This app moved to <a href="../leads/">../leads/</a> — taking you there now…</p>
<script>
  (function () {
    function goNow() { location.replace('../leads/'); }
    if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
        .catch(function () {})
        .then(function () {
          if ('caches' in window) {
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).catch(function () {});
          }
        })
        .then(goNow);
    } else {
      goNow();
    }
  })();
</script>
</body>
</html>
